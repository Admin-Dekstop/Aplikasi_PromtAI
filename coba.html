<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prompt Forge</title>
<style>
  /* Reset & base */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin:0; padding:1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen,
      Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    background: #f5f7fa;
    color: #222;
    line-height: 1.5;
  }

  h1 {
    text-align: center;
    margin-bottom: 1.2rem;
    font-weight: 700;
    color: #2c3e50;
  }

  form {
    max-width: 720px;
    margin: 0 auto;
    background: #fff;
    padding: 1.6rem 2rem 2rem;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgb(0 0 0 / 0.1);
  }

  label {
    display: block;
    margin-bottom: 0.4rem;
    font-weight: 600;
    color: #34495e;
  }

  select, input[type=text], textarea {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border: 1.8px solid #ccc;
    border-radius: 6px;
    font-size: 1rem;
    font-family: inherit;
    transition: border-color 0.25s ease;
  }
  select:focus, input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: #2980b9;
    box-shadow: 0 0 5px #2980b9aa;
  }

  textarea {
    min-height: 90px;
    resize: vertical;
  }

  .row {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .row > div {
    flex: 1 1 48%;
  }
  @media (max-width: 480px) {
    .row > div {
      flex-basis: 100%;
    }
  }

  .btn-group {
    margin-top: 1.6rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
  }
  button {
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 0.6rem 1.6rem;
    border: none;
    border-radius: 8px;
    background-color: #2980b9;
    color: white;
    box-shadow: 0 4px 12px rgb(41 128 185 / 0.4);
    transition: background-color 0.3s ease;
  }
  button:hover, button:focus {
    background-color: #1c5980;
    outline: none;
  }

  #promptOutput {
    margin-top: 2rem;
    white-space: pre-wrap;
    background: #eaf2f8;
    padding: 1rem 1.3rem;
    border-radius: 8px;
    font-family: "Courier New", Courier, monospace;
    font-size: 1rem;
    min-height: 80px;
    user-select: text;
    box-shadow: inset 0 0 5px #a6b8cc;
  }

</style>
</head>
<body>

<h1>Prompt Forge</h1>

<form id="promptForm" autocomplete="off" spellcheck="false">
  <div class="row">
    <div>
      <label for="platform">Platform Tujuan</label>
      <select id="platform" name="platform" required>
        <option value="" disabled selected>-- Pilih Platform --</option>
        <option value="ChatGPT">ChatGPT</option>
        <option value="Gemini">Gemini</option>
        <option value="Blackbox">Blackbox</option>
        <option value="Claude">Claude</option>
        <option value="Canva">Canva</option>
      </select>
    </div>
    <div>
      <label for="role">Peran AI</label>
      <select id="role" name="role" required>
        <option value="" disabled selected>-- Pilih Peran --</option>
        <option value="Asisten Penulis">Asisten Penulis</option>
        <option value="Content Creator">Content Creator</option>
        <option value="Dosen Virtual">Dosen Virtual</option>
        <option value="AI Developer Assistant">AI Developer Assistant</option>
        <option value="Canva Prompt Expert">Canva Prompt Expert</option>
      </select>
    </div>
  </div>

  <!-- Default Form Fields -->
  <div id="defaultFields" style="margin-top:1.5rem;">
    <label for="tujuanPrompt">Tujuan Prompt</label>
    <input type="text" id="tujuanPrompt" name="tujuanPrompt" placeholder="Misal: Membantu menulis artikel..." />

    <label for="topikUtama" style="margin-top:1rem;">Topik Utama</label>
    <input type="text" id="topikUtama" name="topikUtama" placeholder="Misal: Teknologi AI" />

    <label for="gayaBahasa" style="margin-top:1rem;">Gaya Bahasa</label>
    <input type="text" id="gayaBahasa" name="gayaBahasa" placeholder="Misal: Formal, santai, persuasif..." />

    <label for="formatOutput" style="margin-top:1rem;">Format Output</label>
    <input type="text" id="formatOutput" name="formatOutput" placeholder="Misal: Artikel, puisi, dialog..." />

    <label for="panjangOutput" style="margin-top:1rem;">Panjang / Durasi Output</label>
    <input type="text" id="panjangOutput" name="panjangOutput" placeholder="Misal: 500 kata, 2 menit video..." />

    <label for="targetAudiens" style="margin-top:1rem;">Target Audiens</label>
    <input type="text" id="targetAudiens" name="targetAudiens" placeholder="Misal: Pelajar, profesional IT..." />

    <label for="tambahanKhusus" style="margin-top:1rem;">Tambahan Khusus</label>
    <textarea id="tambahanKhusus" name="tambahanKhusus" placeholder="Informasi tambahan atau instruksi khusus"></textarea>

    <!-- Conditional fields -->
    <div id="conditionalFields" style="margin-top:1rem; display:none;">
      <label for="bahasaPemrograman">Bahasa Pemrograman</label>
      <input type="text" id="bahasaPemrograman" name="bahasaPemrograman" placeholder="Misal: Python, JavaScript" />

      <label for="gayaVisual" style="margin-top:1rem; display:none;">Gaya Visual</label>
      <input type="text" id="gayaVisual" name="gayaVisual" placeholder="Misal: Minimalis, flat design" style="display:none;" />
    </div>
  </div>

  <!-- Custom Gemini + Content Creator Form -->
  <div id="geminiContentCreatorForm" style="display:none; margin-top:1.5rem;">
    <label for="ideInti">Ide Inti / Gagasan Utama</label>
    <input type="text" id="ideInti" name="ideInti" placeholder="Masukkan ide inti atau gagasan utama" />

    <label for="subjekPenampilan" style="margin-top:1rem;">Subjek & Penampilan</label>
    <input type="text" id="subjekPenampilan" name="subjekPenampilan" placeholder="Deskripsikan subjek dan penampilan" />

    <label for="emosiPsikologi" style="margin-top:1rem;">Emosi & Psikologi</label>
    <input type="text" id="emosiPsikologi" name="emosiPsikologi" placeholder="Ekspresikan emosi dan psikologi" />

    <label for="tindakanUtama" style="margin-top:1rem;">Tindakan Utama</label>
    <input type="text" id="tindakanUtama" name="tindakanUtama" placeholder="Apa tindakan utama yang terjadi?" />

    <label for="lokasiSuasana" style="margin-top:1rem;">Lokasi & Suasana</label>
    <input type="text" id="lokasiSuasana" name="lokasiSuasana" placeholder="Deskripsikan lokasi dan suasana" />

    <label for="jenisShot" style="margin-top:1rem;">Jenis Shot & Gerakan Kamera</label>
    <select id="jenisShot" name="jenisShot">
      <option value="" disabled selected>-- Pilih Jenis Shot --</option>
      <option value="Medium Close-up (Static)">Medium Close-up (Static)</option>
      <option value="Close-up (Handheld)">Close-up (Handheld)</option>
      <option value="Extreme Close-up (Focus on eyes)">Extreme Close-up (Focus on eyes)</option>
      <option value="Wide Shot (Gimbal)">Wide Shot (Gimbal)</option>
      <option value="Low-angle shot">Low-angle shot</option>
      <option value="FPV Drone Shot">FPV Drone Shot</option>
    </select>

    <label for="gayaPencahayaan" style="margin-top:1rem;">Gaya Pencahayaan</label>
    <input type="text" id="gayaPencahayaan" name="gayaPencahayaan" placeholder="Misal: Natural, dramatis" />

    <label for="referensiArtistik" style="margin-top:1rem;">Referensi Artistik</label>
    <input type="text" id="referensiArtistik" name="referensiArtistik" placeholder="Misal: Film noir, impresionisme" />
  </div>

  <div class="btn-group">
    <button type="button" id="buatPromptBtn">Buat Prompt</button>
    <button type="button" id="salinPromptBtn">Salin Prompt</button>
  </div>

  <pre id="promptOutput" aria-live="polite" aria-label="Output Prompt"></pre>
</form>

<script>
  (function(){
    const platformEl = document.getElementById('platform');
    const roleEl = document.getElementById('role');
    const defaultFieldsEl = document.getElementById('defaultFields');
    const conditionalFieldsEl = document.getElementById('conditionalFields');
    const bahasaPemrogramanEl = document.getElementById('bahasaPemrograman');
    const gayaVisualEl = document.getElementById('gayaVisual');
    const geminiFormEl = document.getElementById('geminiContentCreatorForm');
    const buatPromptBtn = document.getElementById('buatPromptBtn');
    const salinPromptBtn = document.getElementById('salinPromptBtn');
    const promptOutput = document.getElementById('promptOutput');

    function updateFormVisibility() {
      const platform = platformEl.value;
      const role = roleEl.value;

      // Show Gemini + Content Creator custom form only if BOTH conditions true
      if(platform === 'Gemini' && role === 'Content Creator') {
        defaultFieldsEl.style.display = 'none';
        geminiFormEl.style.display = 'block';
      } else {
        defaultFieldsEl.style.display = 'block';
        geminiFormEl.style.display = 'none';
      }

      // Show conditional fields only if peran adalah AI Developer Assistant atau Canva Prompt Expert
      if(role === 'AI Developer Assistant' || role === 'Canva Prompt Expert') {
        conditionalFieldsEl.style.display = 'block';
      } else {
        conditionalFieldsEl.style.display = 'none';
      }

      // Show Gaya Visual only if peran adalah Canva Prompt Expert
      if(role === 'Canva Prompt Expert') {
        gayaVisualEl.style.display = 'block';
        // Label for Gaya Visual also needs to show
        const labelGV = gayaVisualEl.previousElementSibling;
        if(labelGV) labelGV.style.display = 'block';
      } else {
        gayaVisualEl.style.display = 'none';
        const labelGV = gayaVisualEl.previousElementSibling;
        if(labelGV) labelGV.style.display = 'none';
      }
    }

    platformEl.addEventListener('change', updateFormVisibility);
    roleEl.addEventListener('change', updateFormVisibility);

    function buatPrompt() {
      const platform = platformEl.value;
      const role = roleEl.value;

      if(!platform) {
        alert("Silakan pilih Platform Tujuan terlebih dahulu.");
        platformEl.focus();
        return;
      }
      if(!role) {
        alert("Silakan pilih Peran AI terlebih dahulu.");
        roleEl.focus();
        return;
      }

      let prompt = `Platform: ${platform}\nPeran: ${role}\n\n`;

      if(platform === 'Gemini' && role === 'Content Creator') {
        // Gemini + Content Creator custom form
        const ideInti = document.getElementById('ideInti').value.trim();
        const subjekPenampilan = document.getElementById('subjekPenampilan').value.trim();
        const emosiPsikologi = document.getElementById('emosiPsikologi').value.trim();
        const tindakanUtama = document.getElementById('tindakanUtama').value.trim();
        const lokasiSuasana = document.getElementById('lokasiSuasana').value.trim();
        const jenisShot = document.getElementById('jenisShot').value;
        const gayaPencahayaan = document.getElementById('gayaPencahayaan').value.trim();
        const referensiArtistik = document.getElementById('referensiArtistik').value.trim();

        prompt +=
`Ide Inti / Gagasan Utama:
${ideInti || '-'}

Subjek & Penampilan:
${subjekPenampilan || '-'}

Emosi & Psikologi:
${emosiPsikologi || '-'}

Tindakan Utama:
${tindakanUtama || '-'}

Lokasi & Suasana:
${lokasiSuasana || '-'}

Jenis Shot & Gerakan Kamera:
${jenisShot || '-'}

Gaya Pencahayaan:
${gayaPencahayaan || '-'}

Referensi Artistik:
${referensiArtistik || '-'}`;
      } else {
        // Default form
        const tujuanPrompt = document.getElementById('tujuanPrompt').value.trim();
        const topikUtama = document.getElementById('topikUtama').value.trim();
        const gayaBahasa = document.getElementById('gayaBahasa').value.trim();
        const formatOutput = document.getElementById('formatOutput').value.trim();
        const panjangOutput = document.getElementById('panjangOutput').value.trim();
        const targetAudiens = document.getElementById('targetAudiens').value.trim();
        const tambahanKhusus = document.getElementById('tambahanKhusus').value.trim();

        prompt +=
`Tujuan Prompt:
${tujuanPrompt || '-'}

Topik Utama:
${topikUtama || '-'}

Gaya Bahasa:
${gayaBahasa || '-'}

Format Output:
${formatOutput || '-'}

Panjang / Durasi Output:
${panjangOutput || '-'}

Target Audiens:
${targetAudiens || '-'}

Tambahan Khusus:
${tambahanKhusus || '-'}`;

        if(role === 'AI Developer Assistant' || role === 'Canva Prompt Expert') {
          const bahasaPemrograman = bahasaPemrogramanEl.value.trim();
          prompt += `

Bahasa Pemrograman:
${bahasaPemrograman || '-'}`;
        }
        if(role === 'Canva Prompt Expert') {
          const gayaVisual = gayaVisualEl.value.trim();
          prompt += `

Gaya Visual:
${gayaVisual || '-'}`;
        }
      }

      promptOutput.textContent = prompt;
      promptOutput.scrollIntoView({behavior: 'smooth'});
    }

    buatPromptBtn.addEventListener('click', buatPrompt);

    salinPromptBtn.addEventListener('click', () => {
      const text = promptOutput.textContent;
      if(!text.trim()) {
        alert("Tidak ada prompt untuk disalin. Silakan buat prompt terlebih dahulu.");
        return;
      }
      navigator.clipboard.writeText(text).then(() => {
        alert("Prompt berhasil disalin ke clipboard!");
      }, () => {
        alert("Gagal menyalin prompt. Silakan coba lagi.");
      });
    });

    // Initialize form visibility on load
    updateFormVisibility();
  })();
</script>

</body>
</html>
