<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Forge - AI Prompt Builder</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #f0f0f0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 5rem;
    }
    .container {
      background: rgba(30, 30, 45, 0.95);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      max-width: 720px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    h1 {
      text-align: center;
      margin-bottom: 1.6rem;
      font-weight: 700;
      letter-spacing: 1.1px;
      color: #ffdd57;
      text-shadow: 1px 1px 4px rgba(255, 221, 87, 0.7);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }
    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #ddd;
    }
    select, input[type="text"], textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1.2rem;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      background: #2c2c48;
      color: #eee;
      box-shadow: inset 2px 2px 8px rgba(0,0,0,0.7);
      transition: all 0.25s ease;
    }
    select:focus, input:focus, textarea:focus {
      outline: none;
      background-color: #3a3a6e;
      box-shadow: 0 0 10px #ffdd57;
      color: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .hidden {
      display: none;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: flex-end;
    }
    .flex-grow {
      flex: 1 1 220px;
    }
    button {
      cursor: pointer;
      background: #ffdd57;
      color: #332f24;
      font-weight: 700;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 1.1rem;
      margin-top: 0.5rem;
      box-shadow: 0 4px 12px rgba(255, 221, 87, 0.5);
      transition: all 0.3s ease;
    }
    button:hover {
      background-color: #ffca2c;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(255, 202, 44, 0.8);
    }
    button:active {
      transform: translateY(0);
      box-shadow: 0 3px 8px rgba(255, 202, 44, 0.6);
    }
    #promptResult {
      margin-top: 1.6rem;
      background: #1e1e2f;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      white-space: pre-wrap;
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.95rem;
      color: #ffeb99;
      box-shadow: inset 2px 2px 8px rgba(255, 221, 87, 0.3);
      max-height: 260px;
      overflow-y: auto;
    }
    footer {
      margin-top: auto;
      padding: 1.5rem 1rem;
      width: 100%;
      text-align: center;
      background: #1f1f2f;
      color: #bbb;
      font-size: 0.9rem;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.3);
    }
    footer a {
      color: #ffdd57;
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover {
      text-decoration: underline;
    }
    @media (max-width: 600px) {
      .container {
        padding: 1.8rem 1rem;
      }
      .flex-row {
        flex-direction: column;
        align-items: stretch;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Container utama -->
  <div class="container">
    <!-- Isi konten kamu (h1, form, dsb) tetap di sini -->
    <!-- Tidak saya ulangi karena tidak berubah dari aslinya -->
  </div>

  <!-- Footer -->
  <footer>
    Dibuat dengan ❤️ oleh <a href="https://github.com/FandyDev" target="_blank">FandyDev</a> | Prompt Forge &copy; 2025
  </footer>
</body>
</html>
