<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prompt Forge - AI Prompt Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4">
  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-6 mt-6">
    <h1 class="text-2xl font-bold text-center text-blue-700 mb-6">🧠 Prompt Forge - AI Prompt Builder</h1>

    <!-- Pilih Role -->
    <div class="mb-4">
      <label class="font-semibold">Peran AI</label>
      <select id="role" onchange="showForm()" class="w-full mt-1 border rounded-lg p-2">
        <option value="">-- Pilih Peran --</option>
        <option>Asisten Penulis</option>
        <option>Content Creator</option>
        <option>Dosen Virtual</option>
        <option>AI Developer Assistant</option>
        <option>Canva Prompt Expert</option>
      </select>
    </div>

    <!-- Form Utama (disembunyikan dulu) -->
    <div id="mainForm" class="space-y-4 hidden">
      <div>
        <label class="font-semibold">Platform Tujuan</label>
        <select id="platform" class="w-full mt-1 border rounded-lg p-2">
          <option>ChatGPT</option>
          <option>Gemini</option>
          <option>Blackbox</option>
          <option>Claude</option>
          <option>Canva</option>
        </select>
      </div>

      <div>
        <label class="font-semibold">Tujuan Prompt</label>
        <input id="goal" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Buat artikel, script, dsb"/>
      </div>

      <div>
        <label class="font-semibold">Topik Utama</label>
        <input id="topic" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Energi Terbarukan"/>
      </div>

      <div>
        <label class="font-semibold">Gaya Bahasa</label>
        <input id="style" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Ilmiah, Kreatif"/>
      </div>

      <div>
        <label class="font-semibold">Format Output</label>
        <input id="format" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Artikel, JSON, Markdown"/>
      </div>

      <div>
        <label class="font-semibold">Panjang / Durasi Output</label>
        <input id="length" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: 500 kata, 2 menit"/>
      </div>

      <div>
        <label class="font-semibold">Target Audiens</label>
        <input id="audience" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Umum, Mahasiswa"/>
      </div>

      <div>
        <label class="font-semibold">Bahasa Pemrograman (jika coding)</label>
        <input id="langprog" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Python, JS"/>
      </div>

      <div>
        <label class="font-semibold">Gaya Visual (khusus Canva)</label>
        <input id="visualstyle" type="text" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Minimalis, Bold"/>
      </div>

      <div>
        <label class="font-semibold">Tambahan Khusus</label>
        <textarea id="extras" rows="3" class="w-full mt-1 border rounded-lg p-2" placeholder="Contoh: Sertakan referensi, tambahkan contoh"></textarea>
      </div>

      <button onclick="generatePrompt()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg">🔮 Buat Prompt</button>

      <div id="output" class="mt-4 whitespace-pre-wrap bg-gray-100 p-4 rounded-lg text-sm font-mono border"></div>

      <button onclick="copyPrompt()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg">📋 Salin Prompt</button>
    </div>
  </div>

  <script>
    function showForm() {
      const role = document.getElementById('role').value;
      const form = document.getElementById('mainForm');
      if (role) {
        form.classList.remove('hidden');
      } else {
        form.classList.add('hidden');
      }
    }

    function generatePrompt() {
      const platform = document.getElementById('platform').value;
      const goal = document.getElementById('goal').value;
      const topic = document.getElementById('topic').value;
      const style = document.getElementById('style').value;
      const format = document.getElementById('format').value;
      const length = document.getElementById('length').value;
      const audience = document.getElementById('audience').value;
      const langprog = document.getElementById('langprog').value;
      const visualstyle = document.getElementById('visualstyle').value;
      const role = document.getElementById('role').value;
      const extras = document.getElementById('extras').value;

      let prompt = `Anda adalah ${role} profesional di platform ${platform}. Buatlah output dengan:
- Topik: ${topic}
- Tujuan: ${goal}
- Format: ${format}
- Gaya bahasa: ${style}`;

      if (length.trim()) prompt += `\n- Panjang / Durasi: ${length}`;
      if (audience.trim()) prompt += `\n- Target Audiens: ${audience}`;
      if (langprog.trim()) prompt += `\n- Gunakan Bahasa Pemrograman: ${langprog}`;
      if (visualstyle.trim()) prompt += `\n- Gaya Visual: ${visualstyle}`;
      if (extras.trim()) prompt += `\n- Tambahan khusus: ${extras}`;

      prompt += `\n\nPastikan hasil akhir sesuai konteks platform ${platform} dan bermanfaat secara maksimal.`;

      document.getElementById('output').innerText = prompt;
    }

    function copyPrompt() {
      const text = document.getElementById('output').innerText;
      if (text.trim()) {
        navigator.clipboard.writeText(text).then(() => {
          alert("Prompt berhasil disalin ke clipboard! 🎉");
        });
      } else {
        alert("Belum ada prompt untuk disalin!");
      }
    }
  </script>
</body>
</html>
